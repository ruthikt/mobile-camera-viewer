<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Phone Camera — Simple</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 12px; background:#111; color:#eee; display:flex; flex-direction:column; gap:12px; align-items:center; }
    video { width:100%; max-width:720px; border-radius:8px; background:#000; }
    .controls { display:flex; gap:8px; }
    button { padding:8px 12px; border-radius:6px; background:#2b7; border:none; color:#012; font-weight:600; cursor:pointer; }
    .info { font-size:0.9rem; opacity:0.9; }
  </style>
</head>
<body>
  <h2>Phone Camera (Browser)</h2>
  <video id="video" autoplay playsinline></video>
  <div class="controls">
    <button id="startBtn">Start camera</button>
    <button id="stopBtn">Stop</button>
  </div>
  <div class="info">Open this page on your phone and allow camera access. Use the Start button if camera doesn't start automatically.</div>

  <script>
    const video = document.getElementById('video');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    let stream = null;

    async function startCamera() {
      try {
        // Use environment facing camera on phones if available
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        video.srcObject = stream;
      } catch (err) {
        alert('Could not start camera: ' + err.message);
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        video.srcObject = null;
        stream = null;
      }
    }

    // Start automatically if allowed
    startCamera();

    startBtn.addEventListener('click', startCamera);
    stopBtn.addEventListener('click', stopCamera);
  </script>
</body>
</html>
